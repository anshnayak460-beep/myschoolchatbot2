<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chatbot</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #111827);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chat-container {
  width: 95%;
  max-width: 800px;
  height: 90vh;
  background: #1e293b;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
  display: flex;
  flex-direction: column;
}

.header {
  padding: 18px;
  background: #111827;
  text-align: center;
  border-bottom: 1px solid #334155;
}

.header h1 {
  font-size: 24px;
}

.header p {
  color: #94a3b8;
  font-size: 13px;
  margin-top: 5px;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  display: flex;
  margin-bottom: 16px;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.bot .bubble {
  background: #334155;
  border-bottom-left-radius: 4px;
}

.user .bubble {
  background: #2563eb;
  border-bottom-right-radius: 4px;
}

.input-area {
  padding: 15px;
  background: #111827;
  display: flex;
  gap: 10px;
}

#userInput {
  flex: 1;
  resize: none;
  height: 50px;
  border: none;
  outline: none;
  border-radius: 12px;
  padding: 14px;
  background: #334155;
  color: white;
  font-size: 15px;
}

#sendBtn {
  width: 90px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#sendBtn:hover {
  background: #1d4ed8;
}

#sendBtn:disabled {
  background: #475569;
  cursor: not-allowed;
}

.typing {
  color: #94a3b8;
  font-style: italic;
  margin-bottom: 12px;
}

.clear-btn {
  margin-top: 8px;
  padding: 7px 12px;
  border: 1px solid #475569;
  background: transparent;
  color: #cbd5e1;
  border-radius: 8px;
  cursor: pointer;
}

.clear-btn:hover {
  background: #334155;
}
</style>
</head>

<body>

<div class="chat-container">

  <div class="header">
    <h1>🤖 Groq AI Chatbot</h1>
    <p>Powered by Groq API</p>
    <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
  </div>

  <div id="chatBox" class="chat-box">
    <div class="message bot">
      <div class="bubble">
        👋 Hello! I am your AI assistant. Ask me anything.
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea
      id="userInput"
      placeholder="Type your message..."
      onkeydown="handleKey(event)"
    ></textarea>

    <button id="sendBtn" onclick="sendMessage()">
      Send
    </button>
  </div>

</div>

<script>
// ==========================================
// GROQ API CONFIGURATION
// ==========================================

// IMPORTANT:
// Never publish your real API key in GitHub.
// Replace this only for local testing.
const GROQ_API_KEY = 
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

// You can change the model if needed.
const MODEL = "llama-3.3-70b-versatile";

let messages = [
  {
    role: "system",
    content:
      "You are a helpful, friendly AI assistant. Give clear and useful answers."
  }
];

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, type) {

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  bubble.textContent = text;

  message.appendChild(bubble);
  chatBox.appendChild(message);

  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {

  const typing = document.createElement("div");
  typing.id = "typing";
  typing.className = "typing";
  typing.textContent = "🤖 AI is thinking...";

  chatBox.appendChild(typing);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping() {

  const typing = document.getElementById("typing");

  if (typing) {
    typing.remove();
  }
}

async function sendMessage() {

  const text = userInput.value.trim();

  if (!text) return;

  if (GROQ_API_KEY === "YOUR_GROQ_API_KEY") {

    addMessage(
      "⚠️ Please add your Groq API key in the JavaScript code first.",
      "bot"
    );

    return;
  }

  addMessage(text, "user");

  userInput.value = "";

  sendBtn.disabled = true;
  userInput.disabled = true;

  messages.push({
    role: "user",
    content: text
  });

  showTyping();

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_API_KEY
      },

      body: JSON.stringify({

        model: MODEL,

        messages: messages,

        temperature: 0.7,

        max_tokens: 1024

      })

    });

    const data = await response.json();

    removeTyping();

    if (!response.ok) {

      throw new Error(
        data.error?.message || "Groq API request failed."
      );

    }

    const reply =
      data.choices?.[0]?.message?.content ||
      "Sorry, I could not generate a response.";

    messages.push({
      role: "assistant",
      content: reply
    });

    addMessage(reply, "bot");

  } catch (error) {

    removeTyping();

    addMessage(
      "❌ Error: " + error.message,
      "bot"
    );

  } finally {

    sendBtn.disabled = false;
    userInput.disabled = false;
    userInput.focus();

  }
}

function handleKey(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();
  }
}

function clearChat() {

  messages = [
    {
      role: "system",
      content:
        "You are a helpful, friendly AI assistant. Give clear and useful answers."
    }
  ];

  chatBox.innerHTML = `
    <div class="message bot">
      <div class="bubble">
        👋 Chat cleared! Ask me something.
      </div>
    </div>
  `;
}

userInput.focus();
</script>

</body>
</html>
